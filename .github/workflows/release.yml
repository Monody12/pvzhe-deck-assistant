name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build assistant
        shell: pwsh
        run: |
          & .\build-assistant.ps1
          $built = Get-ChildItem -File -Filter *.exe | Where-Object { $_.Name -ne 'PvZHE-Deck-Assistant.exe' } | Select-Object -First 1
          if (-not $built) { throw 'PyInstaller did not produce an exe' }
          Copy-Item -LiteralPath $built.FullName -Destination .\PvZHE-Deck-Assistant.exe -Force
      - uses: softprops/action-gh-release@v2
        with:
          files: PvZHE-Deck-Assistant.exe
          generate_release_notes: true
